name: Build unsigned release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: CFBundleShortVersionString, for example 0.1.0
        required: true
        default: 0.1.0
      tag:
        description: Git tag, for example v0.1.0-alpha.1
        required: true
permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Build release candidate
        env:
          VERSION: ${{ inputs.version }}
          BUNDLE_ID: io.github.scorpioxyb.topislet
          SIGN_IDENTITY: "-"
        run: bash Scripts/build-release.sh

      - name: Verify release candidate
        run: bash Scripts/verify-release-dmg.sh .build/release-artifacts/TopIslet-${{ inputs.version }}-arm64.dmg

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: TopIslet-${{ inputs.tag }}
          path: |
            .build/release-artifacts/TopIslet-*.dmg
            .build/release-artifacts/TopIslet-*.dmg.sha256
          if-no-files-found: error
