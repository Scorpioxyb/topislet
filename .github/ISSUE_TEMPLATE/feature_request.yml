name: Feature request
description: 提议一个可落地的新场景或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: safety
    attributes:
      label: 安全边界
      options:
        - label: 方案不依赖 OCR、抓包、MITM、token 提取、固定坐标控制或全局媒体键
          required: true
