name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先确认问题可在最新版本复现，并删除日志中的个人信息。
  - type: input
    id: version
    attributes:
      label: App 版本或 commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS、MacBook 型号和汽水音乐版本
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - 音乐同步
        - 播放控制
        - 进度条
        - 展开 / 收回动画
        - 布局与刘海校准
        - 日历 / 提醒事项
        - 安装 / 启动
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 打开…\n2. 点击…\n3. 出现…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、录屏或已脱敏诊断
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除用户名、绝对路径、日历内容、账号信息和 token
          required: true
